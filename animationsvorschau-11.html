<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animationsvorschau · 11 Geschichten</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f0f6e9;color:#20402c;font:16px Nunito,Arial,sans-serif;padding:16px}main{max-width:1400px;margin:auto}h1{font-size:clamp(23px,3vw,34px);margin:10px 0}p{color:#516753}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px}.stage{position:relative;overflow:hidden;aspect-ratio:4/3;border:3px solid #8ca66f;border-radius:18px;background:#dceecb}.world{position:absolute;inset:0;transform-origin:0 0;transition:transform .55s ease}.world img{width:100%;height:100%;object-fit:contain;display:block}.mark{position:absolute;border:3px solid #ffdc3b;box-shadow:0 0 10px 5px #ffdf38b0,0 0 24px 13px #ffed7980;transform:translate(-50%,-50%) rotate(var(--angle,0deg));opacity:0;transition:opacity .2s}.mark.on{opacity:1}.panel{background:white;border-radius:16px;padding:15px;align-self:start}.panel img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#e8f2e0;border-radius:12px}.panel h2{font-size:20px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}button,select{border:1px solid #92b08e;border-radius:10px;padding:11px;background:white;color:#19482e;font:inherit;font-weight:700;cursor:pointer}.primary{background:#3f7449;color:#fff}.strip{display:flex;overflow-x:auto;gap:9px;padding:10px 0}.pick{min-width:108px;width:108px;padding:4px;text-align:left;border:2px solid transparent}.pick.current{border-color:#3f7449;background:#dcefcf}.pick img{width:100%;height:67px;object-fit:contain}.pick span{font-size:12px;display:block}.status{color:#506b55;font-weight:700}@media(max-width:780px){.layout{grid-template-columns:1fr}.panel{display:grid;grid-template-columns:90px 1fr;gap:0 12px}.panel img{grid-row:1/4}.panel h2{margin:0}}</style></head><body><main><h1>Animationsvorschau: 11 Geschichten</h1><p>Originalbilder des verrückten Fußballspiels, unveränderte Übergangsdauer von 0,55 Sekunden. Ohne Lesespiel und Spielstände.</p><div class="layout"><div><div class="stage" id="stage"><div class="world" id="world"><img src="./assets/f1df1324a23c2749f25eb1cc547ccca96dc87332b17de601b47fa066976cf6c9.jpg" alt="Verrücktes Fußballfeld"><div class="mark" id="mark"></div></div></div><div class="controls"><button id="prev">← Zurück</button><button class="primary" id="play">▶ Alle abspielen</button><button id="next">Weiter →</button><button id="all">Gesamtbild</button><label>Standzeit <select id="hold"><option value="2500">2,5 s</option><option value="4000" selected>4 s</option><option value="6500">6,5 s</option></select></label></div><div id="strip" class="strip"></div></div><aside class="panel"><img id="thumb" alt="Originaler Ausschnitt"><div id="counter" class="status"></div><h2 id="title"></h2><div id="status" class="status" aria-live="polite"></div></aside></div></main><script>
const stories=[{"id":1,"title":"Finn und die Schwimmflossen","thumbData":"./assets/e3865d1a987a9b2a20588b39343e73ef8b2cb1d6b4176c4dfc0f9812d97ab631.webp","mx":24.2,"my":35.3,"mw":9,"mh":16.7,"shape":"ellipse","angle":23.5},{"id":2,"title":"Das Schwimmbad","thumbData":"./assets/ac51aa93add012fab381ed7fc328c9062a97124ef7ca34b40094fa9496f52e56.webp","mx":51.5,"my":46.6,"mw":24,"mh":18.3,"angle":26.9},{"id":3,"title":"Der Schiedsrichter","thumbData":"./assets/cc69cd0b9cc02f0c44334f76ea1cfb4ef306206dc5b69fd15e45c1ff0677e707.webp","mx":81.9,"my":32,"mw":12,"mh":24,"shape":"ellipse"},{"id":4,"title":"Vati im Handstand","thumbData":"./assets/07ae973cdd95ca748b1b3e8cad5a465285553711814d253329c65a8eea0f107a.webp","mx":78.2,"my":19.7,"mw":6.3,"mh":15.9},{"id":5,"title":"Der gedeckte Tisch","thumbData":"./assets/7fb04581d9cd9e6489a77c25045ef7c80614e4a4dda05a4d2e807563f665ec32.webp","mx":13.6,"my":32,"mw":7.5,"mh":9.1},{"id":6,"title":"Der sportliche Hase","thumbData":"./assets/aeb60cfae00bc3e614d94fa3aea38e49f6f09933fec56ec8995006478410bd3e.webp","mx":20.8,"my":22.6,"mw":7,"mh":15,"shape":"ellipse"},{"id":7,"title":"Die Katze mit der Brille","thumbData":"./assets/e76610711f5de7eb3ee02f74700cf4577d49950e207bc3b27a350f9adb6a07d7.webp","mx":69,"my":88.7,"mw":12,"mh":7},{"id":8,"title":"Die Ameisen und die Eisdiele","thumbData":"./assets/5b4fa26353d133c06b08d9a5f7ef320d335d13cc2c2aa485479ebff432088a99.webp","mx":70.4,"my":75.1,"mw":32.2,"mh":6.6,"shape":"ellipse","angle":-37.1},{"id":9,"title":"Das Schild zum Tor","thumbData":"./assets/9454605c5406a87cd2cfa04641ebe46dd9519ba2f6dcbf039150855bd6016f4a.webp","mx":10.6,"my":46,"mw":4.8,"mh":12.1,"shape":"ellipse","angle":73.9},{"id":10,"title":"Der verschneite Baum","thumbData":"./assets/d450630bff700892b4beb48d2672e01743afd088110a3d5de54b76421451878c.webp","mx":59,"my":14.6,"mw":9.2,"mh":13.2,"shape":"ellipse"},{"id":11,"title":"Die Sonne und der Goldfisch","thumbData":"./assets/bcf38ec4542f2ce3d7342d97aa78868e0cde2f16127035287e06d88691478002.webp","mx":69.2,"my":11.9,"mw":11,"mh":13,"shape":"ellipse"}];
const stage=document.getElementById('stage'),world=document.getElementById('world'),mark=document.getElementById('mark');let index=0,playing=false,timer=0,markTimer=0,overview=false;
const buttons=stories.map((s,i)=>{const b=document.createElement('button');b.className='pick';b.innerHTML='<img src="'+s.thumbData+'" alt=""><span>'+s.id+'. '+s.title+'</span>';b.onclick=()=>{stop();show(i)};document.getElementById('strip').append(b);return b});
function stop(){playing=false;clearTimeout(timer);clearTimeout(markTimer);document.getElementById('play').textContent='▶ Alle abspielen'}
function show(i){clearTimeout(timer);clearTimeout(markTimer);overview=false;index=(i+stories.length)%stories.length;const s=stories[index];document.getElementById('thumb').src=s.thumbData;document.getElementById('counter').textContent='Geschichte '+(index+1)+' von 11';document.getElementById('title').textContent=s.title;document.getElementById('status').textContent=playing?'Automatischer Durchlauf':'Einzelvorschau';buttons.forEach((b,j)=>b.classList.toggle('current',i===j));mark.classList.remove('on');mark.style.left=s.mx+'%';mark.style.top=s.my+'%';mark.style.width=s.mw+'%';mark.style.height=s.mh+'%';mark.style.borderRadius=s.shape==='ellipse'?'50%':'18%';mark.style.setProperty('--angle',(s.angle||0)+'deg');
const scale=2.1,w=stage.clientWidth,h=stage.clientHeight;const x=Math.min(0,Math.max(-w*(scale-1),w/2-s.mx/100*w*scale));const y=Math.min(0,Math.max(-h*(scale-1),h/2-s.my/100*h*scale));world.style.transform='translate('+x+'px,'+y+'px) scale('+scale+')';markTimer=setTimeout(()=>mark.classList.add('on'),550);
if(playing)timer=setTimeout(()=>{if(index===stories.length-1){stop();document.getElementById('status').textContent='Alle 11 Geschichten gezeigt'}else show(index+1)},550+Number(document.getElementById('hold').value))}
document.getElementById('prev').onclick=()=>{stop();show(index-1)};document.getElementById('next').onclick=()=>{stop();show(index+1)};document.getElementById('play').onclick=()=>{if(playing){stop();document.getElementById('status').textContent='Pausiert'}else{playing=true;document.getElementById('play').textContent='Ⅱ Pause';show(index)}};
document.getElementById('all').onclick=()=>{stop();overview=true;mark.classList.remove('on');world.style.transform='none';document.getElementById('status').textContent='Gesamtbild'};window.addEventListener('resize',()=>{if(!overview)show(index)});show(0);
</script></body></html>
