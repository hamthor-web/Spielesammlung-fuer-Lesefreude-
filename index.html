<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#79d3ff">
<meta name="description" content="Lesen, entdecken, erzählen – Startseite mit drei Spielwelten.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Lesen, entdecken, erzählen</title>
<style>
*{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:Arial,system-ui,sans-serif;background:#79d3ff}
body{display:flex;justify-content:center;align-items:flex-start;padding:0 0 max(12px,env(safe-area-inset-bottom))}
main{width:min(100%,1536px)}
.stage{position:relative;width:100%;aspect-ratio:1536/864;margin:0 auto;overflow:hidden}
.stage img{display:block;width:100%;height:100%;object-fit:contain}
.hotspot{position:absolute;display:block;border-radius:28px;text-decoration:none;outline:none}
.hotspot:focus-visible,.hotspot:hover{box-shadow:0 0 0 5px rgba(255,255,255,.94), inset 0 0 0 6px rgba(66,123,255,.55);background:rgba(255,255,255,.06)}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.wuerfeln{left:4.2%; top:24.8%; width:30.2%; height:66.8%;}
.geschichten{left:35.6%; top:24.8%; width:30.2%; height:66.8%;}
.verrueckt{left:67.1%; top:24.8%; width:28.9%; height:66.8%;}
.note{margin:10px auto 0;text-align:center;color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.35);font-size:clamp(.9rem,2vw,1.05rem)}
@media(max-width:700px){body{padding:0}.hotspot:focus-visible,.hotspot:hover{box-shadow:0 0 0 4px rgba(255,255,255,.94), inset 0 0 0 4px rgba(66,123,255,.55)}}
</style>
</head>
<body>
<main>
  <div class="stage" aria-label="Startmenü mit drei Spielwelten">
    <img src="./assets/startmenue.png" alt="Lesen, entdecken, erzählen – Startmenü mit Würfeln, Interaktive Geschichten und Verrücktes">
    <a class="hotspot wuerfeln" href="./paket.html?paket=wuerfeln" aria-label="Würfelpaket öffnen"><span class="sr">Würfelpaket öffnen</span></a>
    <a class="hotspot geschichten" href="./paket.html?paket=geschichten" aria-label="Geschichtenpaket öffnen"><span class="sr">Geschichtenpaket öffnen</span></a>
    <a class="hotspot verrueckt" href="./paket.html?paket=verrueckt" aria-label="Verrückte Spiele öffnen"><span class="sr">Verrückte Spiele öffnen</span></a>
  </div>
  <div class="note">Tippe auf eine Kachel, um die Spielwelt zu öffnen.</div>
</main>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script>
</body>
</html>
