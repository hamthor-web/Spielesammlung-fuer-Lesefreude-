<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7fbf7">
<title>Spiel · Lesen, entdecken, erzählen</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Nunito,"Trebuchet MS",Arial,sans-serif;background:#fff;color:#173c2a;overflow:hidden}
.shell{height:100dvh;display:grid;grid-template-rows:auto 1fr}
.bar{
 display:flex;align-items:center;gap:8px;padding:calc(7px + env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 7px max(8px,env(safe-area-inset-left));
 background:rgba(255,255,255,.97);border-bottom:1px solid #dbe8dd;box-shadow:0 2px 10px rgba(0,0,0,.08);z-index:10
}
.nav{
 display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:0;border-radius:999px;
 padding:9px 12px;background:#e7f3e8;color:#173c2a;font:inherit;font-weight:900;white-space:nowrap
}
.nav.home{background:#fff2c9}
.name{font-weight:950;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:2px}
.frame{width:100%;height:100%;border:0;background:#fff}
.bad{padding:30px;text-align:center;font-weight:800}
@media(max-width:600px){
 .bar{gap:6px}.nav{padding:8px 10px;font-size:.86rem}.name{font-size:.86rem}
}
@media(max-width:430px){
 .name{display:none}.bar{justify-content:center}.nav{flex:1;max-width:190px}
}
</style>
</head>
<body>
<div class="shell">
  <header class="bar">
    <a id="category" class="nav" href="./index.html">← Spielauswahl</a>
    <a class="nav home" href="./index.html">⌂ Hauptauswahl</a>
    <div id="name" class="name">Spiel</div>
  </header>
  <iframe id="frame" class="frame" title="Spiel" allow="autoplay; fullscreen"></iframe>
</div>
<script>
(()=>{
 const cfg={
  freizeit:['Freizeit & Abenteuer','./wuerfeln-freizeit.html','dice'],
  sport:['Sport & Spiel','./wuerfeln-sport.html','dice'],
  maerchen:['Märchen & Zauber','./wuerfeln-maerchen.html','dice'],
  fussballgeschichten:['Auf dem Fußballplatz','./geschichten.html?spiel=football','stories'],
  herbstgeschichten:['Im Herbstpark','./geschichten.html?spiel=park','stories'],
  'verruecktes-fussball':['Das verrückte Fußballspiel','./verruecktes-fussball.html','crazy'],
  'finde-fehler':['Finde den Fehler','./finde-den-fehler.html','crazy']
 };
 const id=new URLSearchParams(location.search).get('spiel'),c=cfg[id];
 const f=document.getElementById('frame'),n=document.getElementById('name'),back=document.getElementById('category');
 if(!c){
   f.remove();document.body.insertAdjacentHTML('beforeend','<div class="bad">Dieses Spiel wurde nicht gefunden.</div>');return
 }
 n.textContent=c[0];document.title=c[0]+' · Lesen, entdecken, erzählen';
 back.href='./index.html#'+c[2];
 // replace verhindert, dass die erste iframe-Navigation die Zurück-Geste "auffrisst"
 requestAnimationFrame(()=>{try{f.contentWindow.location.replace(c[1])}catch(_){f.src=c[1]}})
})();
</script>
</body>
</html>
