<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f6c4f"><title>Spiel · Lesen, entdecken, erzählen</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Nunito,"Trebuchet MS",system-ui,sans-serif;background:#eef6ef;color:#173c2a;overflow:hidden}.shell{height:100%;display:grid;grid-template-rows:auto 1fr}.bar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:#fff;border-bottom:1px solid #d9e6dc;box-shadow:0 3px 12px rgba(0,0,0,.08);z-index:2}.back{border:0;border-radius:999px;padding:10px 14px;background:#e8f3ea;color:#173c2a;font:inherit;font-weight:900;cursor:pointer;white-space:nowrap}.back:focus-visible{outline:3px solid #ffc83d}.name{font-weight:950;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.frame{width:100%;height:100%;border:0;background:#fff}.bad{padding:30px;text-align:center;font-weight:800}</style>
</head>
<body><div class="shell"><header class="bar"><button id="back" class="back" type="button">← Spieleauswahl</button><div id="name" class="name">Spiel</div></header><iframe id="frame" class="frame" title="Spiel"></iframe></div>
<script>
(()=>{const cfg={
 'wochentage':['Wochentage','./spiele/wuerfeln/wochentage.html','#wuerfeln'],
 'freizeit':['Wochentage · Freizeit','./spiele/wuerfeln/freizeit.html','#wuerfeln'],
 'maerchen':['Wochentage · Märchen','./spiele/wuerfeln/maerchen.html','#wuerfeln'],
 'fussballgeschichten':['Auf dem Fußballplatz','./spiele/interaktiv/geschichten.html?spiel=football','#geschichten'],
 'herbstgeschichten':['Im Herbstpark','./spiele/interaktiv/geschichten.html?spiel=park','#geschichten'],
 'verruecktes-fussball':['Das verrückte Fußballspiel','./spiele/verruecktes/fussball/index.html','#verrueckt'],
 'finde-fehler':['Finde den Fehler','./spiele/verruecktes/fehler/index.html','#verrueckt']};
 const p=new URLSearchParams(location.search),id=p.get('spiel'),c=cfg[id],f=document.getElementById('frame'),n=document.getElementById('name');if(c){n.textContent=c[0];document.title=c[0]+' · Lesen, entdecken, erzählen';f.src=c[1]}else{f.remove();document.body.insertAdjacentHTML('beforeend','<div class="bad">Dieses Spiel wurde nicht gefunden.</div>')}
 document.getElementById('back').addEventListener('click',()=>{location.href='./index.html'+(c?c[2]:'')});
})();
</script></body></html>
