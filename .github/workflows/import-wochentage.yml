name: Import Wochentage package

on:
  push:
    paths:
      - '.github/workflows/import-wochentage.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout collection
        uses: actions/checkout@v4

      - name: Download current Wochentage games
        run: |
          curl -L --fail "https://raw.githubusercontent.com/hamthor-web/Wochentage-Spiel/main/sport.html" -o wuerfeln-sport.html
          curl -L --fail "https://raw.githubusercontent.com/hamthor-web/Wochentage-Spiel/main/abenteuer.html" -o wuerfeln-freizeit.html
          curl -L --fail "https://raw.githubusercontent.com/hamthor-web/Wochentage-Spiel/main/maerchen.html" -o wuerfeln-maerchen.html

      - name: Apply package-specific fixes and refresh offline cache
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("wuerfeln-freizeit.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              'const track=[[16.5,24,"move"],[26,19.5,"Montag"],[36.5,20,"card"],[43,22,"football"],[54,22.5,"Dienstag"],[64,22,"move"],[70,22,"star"],[80.5,23.5,"Mittwoch"],[88,31.5,"card"],[91,40.5,"football"],[92,51,"Donnerstag"],[92,62.5,"move"],[90,70,"star"],[80,77,"Freitag"],[67,82.5,"football"],[59.5,83,"card"],[46,82,"Samstag"],[33.5,78,"move"],[28,72,"star"],[17.5,70,"Sonntag"],[8,64,"card"],[7,56.5,"move"]];',
              'const track=[[16.1,24.2,"move"],[25.9,17.6,"Montag"],[36.2,19.6,"card"],[43.3,21.2,"football"],[54.3,22.5,"Dienstag"],[63.8,22.6,"move"],[70.0,22.6,"star"],[79.7,23.6,"Mittwoch"],[87.7,32.5,"card"],[91.2,40.0,"football"],[92.5,51.7,"Donnerstag"],[92.6,62.9,"move"],[90.5,69.9,"star"],[80.5,77.4,"Freitag"],[67.7,81.8,"football"],[59.2,83.7,"card"],[47.1,82.3,"Samstag"],[34.4,79.0,"move"],[28.4,73.4,"star"],[17.9,70.5,"Sonntag"],[8.3,64.3,"card"],[7.0,57.0,"move"]];'
          )
          s = s.replace('const startCenter=[7.5,27.5];','const startCenter=[7.5,29.5];')
          s = s.replace('const goalCenter=[15.5,49.5];','const goalCenter=[16.3,49.2];')
          s = s.replace('const goalSlots=[[7.5,49.5],[25,50.5]];','const goalSlots=[[7.9,48.7],[24.7,49.7]];')
          p.write_text(s, encoding="utf-8")

          sw = Path("sw.js")
          s = sw.read_text(encoding="utf-8")
          s = s.replace("lesen-entdecken-erzaehlen-offline-v2","lesen-entdecken-erzaehlen-offline-v3")
          sw.write_text(s, encoding="utf-8")
          PY

      - name: Commit imported games
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wuerfeln-sport.html wuerfeln-freizeit.html wuerfeln-maerchen.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Update Würfelspiele from Wochentage package"
          git push
