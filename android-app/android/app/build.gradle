apply plugin: 'com.android.application'

def releaseSettings = new groovy.json.JsonSlurper().parse(rootProject.file('../release-settings.json'))
def signingValues = [
    store: System.getenv('LESESPIELE_KEYSTORE'),
    storePassword: System.getenv('LESESPIELE_STORE_PASSWORD'),
    alias: System.getenv('LESESPIELE_KEY_ALIAS'),
    keyPassword: System.getenv('LESESPIELE_KEY_PASSWORD')
]
def signingReady = signingValues.values().every { it }

android {
    namespace = "de.heikeamthor.lesenentdeckenerzaehlen"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures { buildConfig true }
    defaultConfig {
        buildConfigField "boolean", "LOCAL_PREVIEW", "false"
        applicationId "de.heikeamthor.lesespiele"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode(releaseSettings.versionCode as Integer)
        versionName releaseSettings.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (signingReady) {
                storeFile file(signingValues.store)
                storePassword signingValues.storePassword
                keyAlias signingValues.alias
                keyPassword signingValues.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            // Install alongside the published app; local previews never replace it.
            applicationIdSuffix ".test"
            versionNameSuffix "-test"
        }
        release {
            if (signingReady) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        localPreview {
            initWith release
            applicationIdSuffix ".test"
            versionNameSuffix "-belohnungs-test"
            buildConfigField "boolean", "LOCAL_PREVIEW", "true"
            resValue "string", "app_name", "Lesespiele Belohnungs-Test"
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
        internalTest {
            initWith release
            applicationIdSuffix ".test"
            versionNameSuffix "-test"
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name in ['assembleRelease', 'bundleRelease', 'packageRelease', 'signReleaseBundle'] }) {
        if (releaseSettings.packageId != android.defaultConfig.applicationId)
            throw new GradleException('Die Paket-ID in release-settings.json stimmt nicht mit der Android-App überein.')
        if (!signingReady) throw new GradleException('Signierung fehlt: LESESPIELE_* Umgebungsvariablen setzen.')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
